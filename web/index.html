<!doctype html>
<html lang="ru">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <meta name="theme-color" content="#081820">
 <meta name="description" content="Управдом — офлайн-симулятор управляющей компании. Ваш район, ваши люди, ваши решения.">
 <title>Управдом · порядок в каждом доме</title>
 <link rel="icon" href="favicon.svg" type="image/svg+xml">
 <link rel="stylesheet" href="style.css">
 <link rel="stylesheet" href="campaign-ui.css">
 <link rel="stylesheet" href="operations-ui.css">
 <link rel="stylesheet" href="territory-ui.css">
</head>
<body>
 <div id="app">
  <header id="header"></header>
  <main>
   <section id="mapView" aria-label="Диспетчерская карта">
    <canvas id="map" aria-label="Карта района: двигайте одним пальцем, приближайте и отдаляйте двумя пальцами. Заявки также доступны в разделе Заявки."></canvas>
    <div id="mapTop"></div>
    <div id="mapBottom"></div>
   </section>
   <section id="page" hidden aria-label="Управление компанией"></section>
  </main>
  <nav id="nav" aria-label="Основная навигация"></nav>
 </div>
 <dialog id="dialog" aria-labelledby="dialogTitle"></dialog>
 <div id="toast" role="status" aria-live="polite"></div>
 <input id="importFile" type="file" accept="application/json,.json" hidden>
 <script type="module" src="boot.js"></script>
</body>
</html>
