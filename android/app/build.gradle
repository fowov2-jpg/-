plugins { id 'com.android.application' }
// Release credentials belong to the publisher and are supplied only at build time.
def releaseKeys = ['UPRAVDOM_KEYSTORE', 'UPRAVDOM_KEY_ALIAS', 'UPRAVDOM_KEYSTORE_PASSWORD', 'UPRAVDOM_KEY_PASSWORD']
def suppliedKeys = releaseKeys.findAll { System.getenv(it) }
if (!suppliedKeys.isEmpty() && suppliedKeys.size() != releaseKeys.size()) {
    throw new GradleException('Supply all four UPRAVDOM signing variables together; see docs/RELEASE.md')
}
def signedRelease = suppliedKeys.size() == releaseKeys.size()
android {
    namespace 'ru.uyut.upravdom'
    compileSdk 36
    defaultConfig {
        applicationId project.hasProperty('upravdomPreview') ? 'ru.uyut.upravdom.preview' : 'ru.uyut.upravdom'
        manifestPlaceholders = [appLabel: project.hasProperty('upravdomPreview') ? 'Управдом · тест' : 'Управдом']
        minSdk 26
        targetSdk 36
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        versionCode 16
        versionName '0.9.0-rc.1'
    }
    signingConfigs {
        if (project.hasProperty('upravdomPreviewKeystore')) {
            debug {
                storeFile file(project.property('upravdomPreviewKeystore'))
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
        if (signedRelease) {
            publisher {
                storeFile file(System.getenv('UPRAVDOM_KEYSTORE'))
                storePassword System.getenv('UPRAVDOM_KEYSTORE_PASSWORD')
                keyAlias System.getenv('UPRAVDOM_KEY_ALIAS')
                keyPassword System.getenv('UPRAVDOM_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (signedRelease) signingConfig signingConfigs.publisher
        }
    }
    sourceSets { main { assets.srcDirs = ['../../web'] } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.15.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:rules:1.6.1'
}

