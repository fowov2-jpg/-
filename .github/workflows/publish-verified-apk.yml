name: Publish verified APK download
on:
  push:
    branches: [delivery-v0.9.0-rc.1]
    paths: [.github/workflows/publish-verified-apk.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Restore the exact verified APK
        shell: bash
        run: |
          set -euo pipefail
          cd downloads/0.9.0-rc.1
          cat apk.part01 apk.part02 apk.part03 > upravdom-0.9.0-rc.1-preview.apk
          sha256sum --check SHA256SUMS.txt
      - name: Publish Android download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag=v0.9.0-rc.1
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" downloads/0.9.0-rc.1/upravdom-0.9.0-rc.1-preview.apk downloads/0.9.0-rc.1/SHA256SUMS.txt downloads/0.9.0-rc.1/INSTALL_RU.md --clobber
          else
            gh release create "$tag" --target 4033462189ea977acd0f80d22bada026ab0bc509 --prerelease --title 'Управдом 0.9.0-rc.1 — области и мобильная диспетчерская' --notes-file downloads/0.9.0-rc.1/RELEASE_NOTES.md downloads/0.9.0-rc.1/upravdom-0.9.0-rc.1-preview.apk downloads/0.9.0-rc.1/SHA256SUMS.txt downloads/0.9.0-rc.1/INSTALL_RU.md
          fi
